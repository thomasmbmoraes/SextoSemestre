<!DOCTYPE html>
<html>
  <head><title>Exercicio 01</title></head>
  <body>
    <form>

      <label for="nome">Nome completo:</label><br>
      <input type="text" id="nome" name="nome" required><br><br>

      <label for="email">E-mail:</label><br>
      <input type="email" id="email" name="email" required><br><br>

      <label for="senha">Senha:</label><br>
      <input type="password" id="senha" name="senha" minlength="8" required><br><br>

      <label for="dataNascimento">Data de nascimento:</label><br>
      <input type="date" id="dataNascimento" name="dataNascimento"><br><br>

      <label for="telefone">Telefone:</label><br>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000"><br><br>

      <label>Sexo:</label><br>
      <input type="radio" id="masculino" name="sexo" value="masculino">
      <label for="masculino">Masculino</label><br>
      <input type="radio" id="feminino" name="sexo" value="feminino">
      <label for="feminino">Feminino</label><br>
      <input type="radio" id="outro" name="sexo" value="outro">
      <label for="outro">Outro</label><br><br>

      <input type="submit" value="Enviar">
      <input type="reset" value="Limpar">

    </form>
  </body>
</html>
